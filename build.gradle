plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            // TacZ and Ponder ship mixins with SRG refmaps; remap them to dev names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // Our mixin config (in the jar it comes from the manifest below). Its mixins target TacZ only, unremapped, so no refmap.
            args '--mixin.config', "${mod_id}.mixins.json"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        // A second player for co-op testing: its own name (so it doesn't kick the first) and folder.
        client2 {
            parent runs.client
            workingDirectory project.file('run-client2')
            args '--username', 'Dev2'
        }

        server {
            args '--nogui'
        }

        gameTestServer {}

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Not exclusiveContent: ForgeGradle serves the remapped jar under the same group from its own local repo.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.FiguraMC.luaj' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_modrinth_version}")

    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")) {
        transitive = false
    }
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    // The animation value type GeckoLib's keyframes use. GeckoLib bundles it, so it's only needed to compile against.
    compileOnly "com.eliotlash.mclib:mclib:20"

    jarJar(group: 'net.createmod.ponder', name: "Ponder-Forge-${minecraft_version}", version: ponder_version_range) {
        jarJar.pin(it, ponder_version)
        transitive = false
    }
    jarJar(group: 'dev.engine-room.flywheel', name: "flywheel-forge-${minecraft_version}", version: flywheel_version_range) {
        jarJar.pin(it, flywheel_version)
        transitive = false
    }
    jarJar(group: 'software.bernie.geckolib', name: "geckolib-forge-${minecraft_version}", version: geckolib_version_range) {
        jarJar.pin(it, geckolib_version)
        transitive = false
    }

    // TacZ jarJars the same LuaJ fork, so in dev it is already on the game classpath. jarJar here keeps us working without it.
    compileOnly "com.github.FiguraMC.luaj:luaj-core:${luaj_version}"
    testImplementation "com.github.FiguraMC.luaj:luaj-core:${luaj_version}"
    jarJar(group: 'com.github.FiguraMC.luaj', name: 'luaj-core', version: luaj_version_range) {
        jarJar.pin(it, luaj_version)
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            tacz_version_range: tacz_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}

reobf {
    jarJar {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
